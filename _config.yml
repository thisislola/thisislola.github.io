# ── Site ──────────────────────────────────────────────────────
title:       "Lorena Carthy-Wilmot"
description: "Digital Forensics & Cyber Security"
url:         "https://www.lorenacw.com"
baseurl:     ""
lang:        "en"
author:      "Lorena Carthy-Wilmot"

# ── Build ─────────────────────────────────────────────────────
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/
sass:
  style: compressed
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Slide decks: one file per talk in _talks/, slides in assets/talks/<name>/
collections:
  talks:
    output: true
    permalink: /talks/:name/
defaults:
  - scope: { path: "", type: talks }
    values: { layout: deck }
# Setting exclude replaces Jekyll's defaults, so they are repeated here.
exclude: [README.md, Gemfile, Gemfile.lock, node_modules, vendor, gemfiles, .sass-cache, .jekyll-cache]

# ── Homepage ──────────────────────────────────────────────────
home_intro: >
  <p>Digital forensics and cyber security. Head of Security Strategy (Europe) at
  <a href="https://iverify.io">iVerify</a>. Mostly digging into <strong>iOS forensics</strong>
  and <strong>mobile threat hunting</strong>. These are my notes.</p>

# "Currently" list on the homepage lives in _data/now.yml

# Independent work
company_name: "via Emeriss in Norway and my own ENK."
company_url:  "https://emeriss.no/"
company_note: "I take on a small number of independent engagements alongside my day job."

# ── CV (content lives in _data/*.yml) ─────────────────────────
resume_name:     "Lorena Carthy-Wilmot"
resume_title:    "Digital Forensics & Cyber Security"
resume_avatar:   true
resume_contact_email:        "hei[at]lorenacw.com"
location:                    "Oslo, Norway"   # used on the homepage, CV and footer
certifications:              "GIME, GCFE"     # shown as "Certified" on the homepage
resume_header_intro: "<p>I have a background in digital forensics and cybersecurity.</p>"

# Toggle CV sections on/off
resume_section_experience:    true
resume_section_education:     true
resume_section_presentations: true
resume_section_projects:      true
resume_section_associations:  true
resume_section_interests:     false   # add items to _data/interests.yml, then set to true

resume_social_links:
  resume_github_url:   "https://github.com/thisislola"
  resume_bluesky_url:  "https://bsky.app/profile/lorenacw.com"
  resume_linkedin_url: "https://www.linkedin.com/in/LorenaCW"
  resume_medium_url:   "https://medium.com/@randomdent"
