# ── Site ──────────────────────────────────────────────────────
title:       "Lorena Carthy-Wilmot"
description: "Digital Forensics & Cyber Security"
url:         "https://www.lorenacw.com"
baseurl:     ""
lang:        "en"
author:      "Lorena Carthy-Wilmot"

# ── Build ─────────────────────────────────────────────────────
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/
sass:
  style: compressed
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# ── Homepage ──────────────────────────────────────────────────
home_intro: >
  <p>I work in digital forensics and cyber security, currently as Head of Security
  Strategy (Europe) at <a href="https://iverify.io">iVerify</a>. Most of my curiosity
  goes into <strong>iOS forensics</strong> and <strong>mobile threat hunting</strong>:
  where the artifacts live, what they can tell you, and how to find what shouldn't be there.
  This is where I keep notes on what I'm learning.</p>

# "Currently" list on the homepage lives in _data/now.yml

# Independent work, shown as a quiet note near the bottom of the homepage
# and on the CV. Leave company_name empty to hide it.
company_name: ""
company_url:  ""
company_note: "I take on a small number of independent engagements alongside my day job: iOS forensic analysis, mobile threat assessments and training."

