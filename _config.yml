resume_header_intro: "<p>I work at the intersection of digital forensics and security strategy, with a career focused on one mission: protecting data integrity and people’s privacy against increasingly sophisticated threats.
As Head of Security Strategy (Europe) at iVerify, I focus on advancing mobile Endpoint Detection and Response (EDR), with an emphasis on advanced threat hunting and mobile threat intelligence. My work centres on uncovering sophisticated attacks targeting the most overlooked and least protected endpoint, mobile devices, and helping organisations detect, investigate, and neutralise mobile-borne threats in an increasingly hostile digital landscape.
</p>"

