# ── Site ──────────────────────────────────────────────────────
title:       "Lorena Carthy-Wilmot"
description: "Digital Forensics & Cyber Security"
url:         "https://www.lorenacw.com"
baseurl:     ""
lang:        "en"
author:      "Lorena Carthy-Wilmot"

# ── Build ─────────────────────────────────────────────────────
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/
sass:
  style: compressed
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# ── Homepage (intro + recent posts + CV link) ─────────────────
home_heading: "Researching threats on the most overlooked endpoint: <em>your phone</em>."
home_intro: >
  <p>I work at the intersection of digital forensics and cybersecurity.
  I'm Head of Security Strategy (Europe) at <a href="https://iverify.io">iVerify</a>.</p>

# Three short "what I do" statements shown on the homepage.
home_focus:
  - title: "Mobile threat research"
    text: "Spyware, targeted intrusions and the gaps most MDM and EDR stacks weren't designed to cover."
  - title: "Digital forensics"
    text: "Digital investigations for the Norwegian Police and corporate cases, plus forensic methodology development."
  - title: "Protecting people at risk"
    text: "Security for journalists and the sensitive information they handle, in defence of free expression."

# ── CV (content lives in _data/*.yml) ─────────────────────────
resume_name:     "Lorena Carthy-Wilmot"
